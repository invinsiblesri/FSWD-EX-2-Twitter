<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Twitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <div class="app-container">
      <!-- Sticky Glassmorphic Header -->
      <header class="app-header">
        <div class="brand">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.313 3.198 4.352 3.234-1.595 1.25-3.604 1.995-5.786 1.995-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"/>
            </svg>
          </div>
          <h1>Mini Twitter</h1>
        </div>

        <button id="themeToggle" class="icon-btn" title="Toggle Dark/Light Theme" aria-label="Toggle Theme">
          <svg id="sunIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="moonIcon" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </header>

      <!-- Filter Tabs -->
      <nav class="feed-tabs">
        <button class="tab-btn active" data-filter="all">For You</button>
        <button class="tab-btn" data-filter="liked">Liked Posts</button>
      </nav>

      <!-- Post Composer -->
      <section class="composer">
        <div class="avatar avatar-user">U</div>
        <div class="composer-body">
          <textarea
            id="postInput"
            rows="3"
            maxlength="280"
            placeholder="What's happening right now?"
          ></textarea>
          <div class="composer-footer">
            <span class="shortcut-hint">Ctrl + Enter to post</span>
            <div class="composer-controls">
              <!-- Circular Progress Indicator -->
              <div class="char-ring-wrapper">
                <svg class="char-ring" width="28" height="28">
                  <circle class="ring-bg" cx="14" cy="14" r="11" stroke-width="2.5" fill="none" />
                  <circle id="ringProgress" class="ring-fill" cx="14" cy="14" r="11" stroke-width="2.5" fill="none" />
                </svg>
                <span id="charCount" class="char-count">280</span>
              </div>
              <button id="postBtn" class="btn-primary" disabled>Post</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Feed Container -->
      <main id="postFeed" class="feed"></main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
