<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Mini Twitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout-grid">
    <!-- LEFT SIDEBAR (Desktop & Tablet) -->
    <aside class="sidebar-left">
      <div class="sidebar-left-inner">
        <div class="brand">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.313 3.198 4.352 3.234-1.595 1.25-3.604 1.995-5.786 1.995-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"/>
            </svg>
          </div>
          <span class="brand-title">Mini Twitter</span>
        </div>

        <nav class="side-nav">
          <button class="nav-item active" data-view="all">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
          </button>

          <button class="nav-item" data-view="liked">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <span>Liked</span>
          </button>

          <button class="nav-item" data-view="bookmarks">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Bookmarks</span>
          </button>

          <button class="nav-item" data-view="profile">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profile</span>
          </button>
        </nav>

        <button id="sidebarPostBtn" class="btn-primary sidebar-post-btn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Post</span>
        </button>

        <div class="sidebar-profile-pill" id="sidebarProfileCard">
          <div class="avatar avatar-sm" id="sideAvatar">S</div>
          <div class="profile-pill-info">
            <div class="pill-name" id="sideName">Sri</div>
            <div class="pill-handle" id="sideHandle">@invinsiblesri</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- CENTER FEED COLUMN -->
    <div class="main-column">
      <!-- Sticky Top Header -->
      <header class="app-header">
        <div class="header-left">
          <div class="mobile-logo">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.313 3.198 4.352 3.234-1.595 1.25-3.604 1.995-5.786 1.995-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"/>
            </svg>
          </div>
          <h1 id="headerTitle">Home</h1>
        </div>

        <div class="header-actions">
          <button id="mobileSearchToggle" class="icon-btn mobile-only" title="Search" aria-label="Search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>

          <button id="themeToggle" class="icon-btn" title="Toggle Dark/Light Theme" aria-label="Toggle Theme">
            <svg id="sunIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="moonIcon" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Mobile Expandable Search Bar -->
      <div id="mobileSearchBar" class="mobile-search-bar hidden">
        <input type="text" id="mobileSearchInput" placeholder="Search posts or #hashtags..." />
        <button id="clearMobileSearch" class="text-btn">Clear</button>
      </div>

      <!-- Feed Filter Tabs -->
      <nav class="feed-tabs">
        <button class="tab-btn active" data-view="all">For You</button>
        <button class="tab-btn" data-view="liked">Liked</button>
        <button class="tab-btn" data-view="bookmarks">Bookmarks</button>
      </nav>

      <!-- Active Tag / Search Filter Banner -->
      <div id="activeFilterBanner" class="filter-banner hidden">
        <span id="activeFilterText">Showing results</span>
        <button id="resetFilterBtn" class="text-btn">Clear filter</button>
      </div>

      <!-- Profile Card Section (Shown on Profile Tab) -->
      <section id="profileSection" class="profile-section hidden">
        <div class="profile-cover"></div>
        <div class="profile-details">
          <div class="profile-top-row">
            <div class="avatar avatar-lg" id="profileAvatarLg">S</div>
            <button id="editProfileToggle" class="btn-secondary">Edit Profile</button>
          </div>
          <h2 id="profileDisplayName">Sri</h2>
          <p class="profile-handle" id="profileDisplayHandle">@invinsiblesri</p>
          <p class="profile-bio" id="profileDisplayBio">Full-Stack Web Developer building clean, fast & responsive web experiences.</p>
          <div class="profile-stats">
            <span><strong id="statPosts">0</strong> Posts</span>
            <span><strong id="statFollowing">2</strong> Following</span>
            <span><strong>148</strong> Followers</span>
          </div>

          <!-- Inline Profile Editor -->
          <form id="profileEditForm" class="profile-edit-form hidden">
            <input type="text" id="editNameInput" maxlength="30" placeholder="Display Name" required />
            <input type="text" id="editHandleInput" maxlength="25" placeholder="@handle" required />
            <textarea id="editBioInput" rows="2" maxlength="140" placeholder="Short bio..."></textarea>
            <div class="edit-controls">
              <button type="button" id="cancelProfileEdit" class="btn-secondary">Cancel</button>
              <button type="submit" class="btn-primary">Save Profile</button>
            </div>
          </form>
        </div>
      </section>

      <!-- Post Composer -->
      <section class="composer" id="composerSection">
        <div class="avatar" id="composerAvatar">S</div>
        <div class="composer-body">
          <textarea
            id="postInput"
            rows="3"
            maxlength="280"
            placeholder="What's happening? Use #hashtags to categorize..."
          ></textarea>

          <!-- Optional Image URL Drawer -->
          <div id="imageInputDrawer" class="image-drawer hidden">
            <input
              type="url"
              id="postImageUrl"
              placeholder="Paste an image URL (https://...)"
            />
          </div>

          <!-- Quick Emoji Picker -->
          <div id="emojiBar" class="emoji-bar hidden">
            <button type="button" class="emoji-btn">🚀</button>
            <button type="button" class="emoji-btn">🔥</button>
            <button type="button" class="emoji-btn">💡</button>
            <button type="button" class="emoji-btn">💻</button>
            <button type="button" class="emoji-btn">✨</button>
            <button type="button" class="emoji-btn">❤️</button>
            <button type="button" class="emoji-btn">👏</button>
            <button type="button" class="emoji-btn">😂</button>
          </div>

          <div class="composer-footer">
            <div class="composer-tools">
              <button type="button" id="toggleImageBtn" class="tool-icon-btn" title="Add Image URL">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
              </button>
              <button type="button" id="toggleEmojiBtn" class="tool-icon-btn" title="Insert Emoji">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                  <line x1="9" y1="9" x2="9.01" y2="9"></line>
                  <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
              </button>
            </div>

            <div class="composer-controls">
              <div class="char-ring-wrapper">
                <svg class="char-ring" width="26" height="26">
                  <circle class="ring-bg" cx="13" cy="13" r="10" stroke-width="2.5" fill="none" />
                  <circle id="ringProgress" class="ring-fill" cx="13" cy="13" r="10" stroke-width="2.5" fill="none" />
                </svg>
                <span id="charCount" class="char-count">280</span>
              </div>
              <button id="postBtn" class="btn-primary" disabled>Post</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Posts Feed -->
      <main id="postFeed" class="feed"></main>
    </div>

    <!-- RIGHT SIDEBAR (Desktop) -->
    <aside class="sidebar-right">
      <div class="sidebar-right-inner">
        <!-- Desktop Search -->
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="desktopSearchInput" placeholder="Search Mini Twitter" />
        </div>

        <!-- Trending Hashtags Card -->
        <div class="widget-card">
          <h3>Trending Now</h3>
          <div class="trend-list" id="trendList">
            <button class="trend-item" data-tag="#WebDev">
              <span class="trend-meta">Technology · Trending</span>
              <span class="trend-tag">#WebDev</span>
              <span class="trend-count">1.4K posts</span>
            </button>
            <button class="trend-item" data-tag="#JavaScript">
              <span class="trend-meta">Programming · Trending</span>
              <span class="trend-tag">#JavaScript</span>
              <span class="trend-count">980 posts</span>
            </button>
            <button class="trend-item" data-tag="#UIUX">
              <span class="trend-meta">Design · Popular</span>
              <span class="trend-tag">#UIUX</span>
              <span class="trend-count">640 posts</span>
            </button>
          </div>
        </div>

        <!-- Who to Follow Card -->
        <div class="widget-card">
          <h3>Who to Follow</h3>
          <div class="follow-list" id="followList">
            <div class="follow-item">
              <div class="avatar avatar-alt avatar-sm">A</div>
              <div class="follow-info">
                <div class="follow-name">Alex Rivera</div>
                <div class="follow-handle">@alexcodes</div>
              </div>
              <button class="btn-follow following" data-user="alexcodes">Following</button>
            </div>
            <div class="follow-item">
              <div class="avatar avatar-green avatar-sm">M</div>
              <div class="follow-info">
                <div class="follow-name">Maya Lin</div>
                <div class="follow-handle">@mayaui</div>
              </div>
              <button class="btn-follow" data-user="mayaui">Follow</button>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- MOBILE FLOATING COMPOSE BUTTON -->
  <button id="mobileFab" class="mobile-fab" aria-label="Create Post">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>

  <!-- MOBILE BOTTOM NAVIGATION BAR -->
  <nav class="mobile-bottom-nav">
    <button class="bottom-nav-item active" data-view="all" aria-label="Home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Home</span>
    </button>

    <button class="bottom-nav-item" data-view="liked" aria-label="Liked">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      <span>Liked</span>
    </button>

    <button class="bottom-nav-item" data-view="bookmarks" aria-label="Bookmarks">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>Saved</span>
    </button>

    <button class="bottom-nav-item" data-view="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Profile</span>
    </button>
  </nav>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
